name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Initialize MPVKit Submodule
        run: |
          git submodule update --init MPVKit

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Dummy Local Properties
        run: touch local.properties

      # Compiles the framework for physical devices (ARM64) to match the IPA target
      - name: Build KMP Framework
        run: ./gradlew :composeApp:compileKotlinIosArm64

      # Explicitly passes JAVA_HOME and the system PATH to the Xcode build process
      - name: Build Xcode Project (Unsigned)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj \
                     -scheme iosApp \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     JAVA_HOME="$JAVA_HOME" \
                     clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r iosApp/build/Build/Products/Release-iphoneos/iosApp.app Payload/
          zip -r NuvioMobile-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioMobile-unsigned-ipa
          path: NuvioMobile-unsigned.ipa
