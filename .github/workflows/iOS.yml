name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # Automatically fetches any submodules if present
          fetch-depth: 0          # Fetches all history for git-describe tools

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Installs CocoaPods if your KMP project requires them for iOS
      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod setup

      - name: Build KMP Framework
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64

      - name: Build Xcode Project (Unsigned)
        run: |
          cd iosApp
          xcodebuild -workspace iosApp.xcworkspace \
                     -scheme iosApp \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r iosApp/build/Build/Products/Release-iphoneos/iosApp.app Payload/
          zip -r NuvioMobile-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioMobile-unsigned-ipa
          path: NuvioMobile-unsigned.ipa
